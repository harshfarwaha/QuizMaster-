<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuizMaster — Turn Any Page Into a Quiz</title>
<meta name="description" content="Paste a link, get an instant AI-generated multiple-choice quiz from that page's content.">
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --bg:#0c1210; --surface:#141d1a; --bg-raise:#121a17;
    --border:#263029; --border-bright:#3a4a3f;
    --text:#e9ede9; --text-muted:#8ea095; --text-dim:#82938a;
    --amber:#e8a33d; --amber-dim:#a67527;
    --cyan:#5fd8c7; --cyan-dim:#3a9083;
    --red:#e2665f;
    --mono:'JetBrains Mono', ui-monospace, monospace;
    --body:'Inter', -apple-system, sans-serif;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{
    background:var(--bg); color:var(--text); font-family:var(--body);
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
    padding:60px 20px;
    background-image:
      linear-gradient(var(--border) 1px, transparent 1px),
      linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size:48px 48px;
  }
  .wrap{ width:100%; max-width:680px; }

  header{ text-align:center; margin-bottom:44px; }
  .eyebrow{
    font-family:var(--mono); font-size:12px; letter-spacing:.18em; color:var(--cyan);
    text-transform:uppercase; display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:16px;
  }
  .blip{ width:7px; height:7px; background:var(--cyan); box-shadow:0 0 8px 2px rgba(95,216,199,.6); animation:blip 1.8s ease-in-out infinite; }
  @keyframes blip{ 0%,100%{opacity:1;} 50%{opacity:.25;} }
  h1{
    font-family:var(--mono); font-weight:700; font-size:clamp(30px,6vw,46px);
    text-transform:uppercase; letter-spacing:-.01em;
  }
  h1 span{ color:var(--amber); }
  .tagline{ color:var(--text-muted); margin-top:12px; font-size:15.5px; }

  .card{
    position:relative; background:var(--surface); border:1px solid var(--border);
    padding:36px; margin-bottom:24px;
  }
  .card::before, .card::after{
    content:""; position:absolute; width:14px; height:14px; border:1.5px solid var(--cyan-dim);
  }
  .card::before{ top:-1px; left:-1px; border-right:none; border-bottom:none; }
  .card::after{ bottom:-1px; right:-1px; border-left:none; border-top:none; }

  label{
    display:block; font-family:var(--mono); font-size:11.5px; letter-spacing:.1em;
    text-transform:uppercase; color:var(--text-dim); margin-bottom:10px;
  }
  input[type="url"]{
    width:100%; background:var(--bg-raise); border:1px solid var(--border-bright);
    color:var(--text); font-family:var(--body); font-size:15px; padding:14px 16px;
    outline:none; transition:border-color .2s ease;
  }
  input[type="url"]:focus{ border-color:var(--cyan); }
  input[type="url"]::placeholder{ color:var(--text-dim); }

  .row{ display:flex; gap:20px; margin-top:20px; align-items:flex-end; flex-wrap:wrap; }
  .row > div{ flex:1; min-width:160px; }

  select{
    width:100%; background:var(--bg-raise); border:1px solid var(--border-bright);
    color:var(--text); font-family:var(--mono); font-size:14px; padding:13px 14px;
    outline:none;
  }

  button{
    font-family:var(--mono); font-size:14px; letter-spacing:.04em; padding:14px 26px;
    border:1px solid var(--amber-dim); color:var(--amber); background:transparent;
    cursor:pointer; transition:all .2s ease; white-space:nowrap;
  }
  button:hover:not(:disabled){ border-color:var(--amber); background:rgba(232,163,61,.08); transform:translateY(-1px); }
  button:disabled{ opacity:.5; cursor:not-allowed; }
  .btn-full{ width:100%; margin-top:24px; padding:16px; font-size:15px; }
  .btn-ghost{ border-color:var(--border-bright); color:var(--text); }
  .btn-ghost:hover:not(:disabled){ border-color:var(--cyan-dim); color:var(--cyan); background:rgba(95,216,199,.06); }

  .error{
    color:var(--red); font-family:var(--mono); font-size:13px; margin-top:16px;
    padding:12px 14px; border:1px solid rgba(226,102,95,.4); background:rgba(226,102,95,.06);
    display:none;
  }
  .error.visible{ display:block; }

  .loading{ display:none; text-align:center; padding:20px 0; }
  .loading.visible{ display:block; }
  .spinner{
    width:32px; height:32px; border:2px solid var(--border-bright); border-top-color:var(--cyan);
    border-radius:50%; margin:0 auto 16px; animation:spin 0.8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .loading p{ font-family:var(--mono); font-size:13px; color:var(--text-dim); }

  #setup-screen, #quiz-screen, #results-screen{ display:none; }
  #setup-screen.visible, #quiz-screen.visible, #results-screen.visible{ display:block; }

  .q-meta{
    display:flex; justify-content:space-between; align-items:center;
    font-family:var(--mono); font-size:12px; color:var(--text-dim); margin-bottom:18px;
    text-transform:uppercase; letter-spacing:.08em;
  }
  .q-meta .timer{ color:var(--amber); }
  .q-meta .timer.warn{ color:var(--red); }

  .q-text{ font-size:19px; font-weight:600; margin-bottom:26px; line-height:1.5; }

  .option{
    display:flex; align-items:center; gap:14px; padding:16px 18px; margin-bottom:12px;
    border:1px solid var(--border-bright); background:var(--bg-raise); cursor:pointer;
    transition:all .2s ease; font-size:14.5px;
  }
  .option:hover{ border-color:var(--cyan-dim); }
  .option.selected{ border-color:var(--cyan); background:rgba(95,216,199,.07); color:var(--cyan); }
  .option.correct{ border-color:#5fd88a; background:rgba(95,216,138,.08); color:#5fd88a; }
  .option.incorrect{ border-color:var(--red); background:rgba(226,102,95,.08); color:var(--red); }
  .option-letter{
    font-family:var(--mono); font-size:12px; width:24px; height:24px; border:1px solid currentColor;
    border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }

  .quiz-nav{ display:flex; justify-content:space-between; margin-top:28px; gap:14px; }

  .progress-bar{ height:3px; background:var(--border); margin-bottom:28px; overflow:hidden; }
  .progress-bar-fill{ height:100%; background:linear-gradient(90deg,var(--cyan),var(--amber)); transition:width .3s ease; }

  .score-display{ text-align:center; padding:20px 0 30px; }
  .score-num{ font-family:var(--mono); font-size:56px; font-weight:700; color:var(--amber); }
  .score-label{ font-family:var(--mono); font-size:12px; color:var(--text-dim); letter-spacing:.1em; text-transform:uppercase; margin-top:8px; }

  .review-item{ padding:16px 0; border-top:1px dashed var(--border); }
  .review-item:first-child{ border-top:none; }
  .review-q{ font-size:14.5px; font-weight:600; margin-bottom:8px; }
  .review-a{ font-family:var(--mono); font-size:12.5px; display:flex; gap:8px; align-items:flex-start; margin-top:4px; }
  .review-a.correct{ color:#5fd88a; }
  .review-a.incorrect{ color:var(--red); }
  .review-explain{ color:var(--text-dim); font-size:12.5px; margin-top:6px; font-family:var(--body); }

  footer{ margin-top:20px; font-family:var(--mono); font-size:11px; color:var(--text-dim); letter-spacing:.06em; }

  @media (max-width:520px){
    .card{ padding:24px 20px; }
    .row{ flex-direction:column; align-items:stretch; }
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="eyebrow"><span class="blip"></span>PASTE A LINK / GET A QUIZ</div>
    <h1>Quiz<span>Master</span></h1>
    <p class="tagline">Paste any webpage link — get an instant multiple-choice quiz generated from its content.</p>
  </header>

  <!-- SETUP -->
  <div id="setup-screen" class="card visible">
    <label for="url-input">Webpage URL</label>
    <input type="url" id="url-input" placeholder="https://example.com/article">

    <div class="row">
      <div>
        <label for="num-questions">Number of Questions</label>
        <select id="num-questions">
          <option value="3">3 questions</option>
          <option value="5" selected>5 questions</option>
          <option value="7">7 questions</option>
          <option value="10">10 questions</option>
        </select>
      </div>
    </div>

    <button class="btn-full" id="generate-btn">Generate Quiz →</button>
    <div class="error" id="setup-error"></div>

    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p>Reading the page and building your quiz...</p>
    </div>
  </div>

  <!-- QUIZ -->
  <div id="quiz-screen" class="card">
    <div class="progress-bar"><div class="progress-bar-fill" id="progress-fill"></div></div>
    <div class="q-meta">
      <span id="q-counter">Question 1 / 5</span>
      <span class="timer" id="q-timer">30s</span>
    </div>
    <div class="q-text" id="q-text"></div>
    <div id="options-container"></div>
    <div class="quiz-nav">
      <button class="btn-ghost" id="quit-btn">Quit</button>
      <button id="next-btn" disabled>Next →</button>
    </div>
  </div>

  <!-- RESULTS -->
  <div id="results-screen" class="card">
    <div class="score-display">
      <div class="score-num" id="score-num">0/0</div>
      <div class="score-label">Final Score</div>
    </div>
    <div id="review-container"></div>
    <button class="btn-full" id="restart-btn">Make Another Quiz</button>
  </div>

  <footer>QUIZMASTER — GENERATED VIA AI FROM YOUR LINK</footer>
</div>

<script>
  const setupScreen = document.getElementById('setup-screen');
  const quizScreen = document.getElementById('quiz-screen');
  const resultsScreen = document.getElementById('results-screen');
  const urlInput = document.getElementById('url-input');
  const numQuestionsSelect = document.getElementById('num-questions');
  const generateBtn = document.getElementById('generate-btn');
  const setupError = document.getElementById('setup-error');
  const loading = document.getElementById('loading');
  const qCounter = document.getElementById('q-counter');
  const qTimer = document.getElementById('q-timer');
  const qText = document.getElementById('q-text');
  const optionsContainer = document.getElementById('options-container');
  const nextBtn = document.getElementById('next-btn');
  const quitBtn = document.getElementById('quit-btn');
  const progressFill = document.getElementById('progress-fill');
  const scoreNum = document.getElementById('score-num');
  const reviewContainer = document.getElementById('review-container');
  const restartBtn = document.getElementById('restart-btn');

  let questions = [];
  let currentIndex = 0;
  let selectedOption = null;
  let userAnswers = [];
  let timerInterval = null;
  let timeLeft = 30;

  function showScreen(screen){
    [setupScreen, quizScreen, resultsScreen].forEach(s => s.classList.remove('visible'));
    screen.classList.add('visible');
  }

  function showError(msg){
    setupError.textContent = msg;
    setupError.classList.add('visible');
  }
  function clearError(){
    setupError.classList.remove('visible');
    setupError.textContent = '';
  }

  generateBtn.addEventListener('click', async () => {
    clearError();
    const url = urlInput.value.trim();
    const numQuestions = numQuestionsSelect.value;

    if(!url){
      showError('Please enter a URL.');
      return;
    }

    generateBtn.disabled = true;
    loading.classList.add('visible');

    try{
      const res = await fetch('/api/generate-quiz', {
        method:'POST',
        headers:{ 'Content-Type':'application/json' },
        body: JSON.stringify({ url, num_questions: numQuestions })
      });
      const data = await res.json();

      if(!res.ok){
        showError(data.error || 'Something went wrong. Please try again.');
        return;
      }

      questions = data.questions;
      currentIndex = 0;
      userAnswers = new Array(questions.length).fill(null);
      showScreen(quizScreen);
      renderQuestion();

    }catch(err){
      showError('Could not reach the server. Please try again.');
    }finally{
      generateBtn.disabled = false;
      loading.classList.remove('visible');
    }
  });

  function renderQuestion(){
    const q = questions[currentIndex];
    selectedOption = null;
    nextBtn.disabled = true;
    nextBtn.textContent = currentIndex === questions.length - 1 ? 'Finish →' : 'Next →';

    qCounter.textContent = `Question ${currentIndex + 1} / ${questions.length}`;
    progressFill.style.width = `${((currentIndex) / questions.length) * 100}%`;
    qText.textContent = q.question;

    optionsContainer.innerHTML = '';
    const letters = ['A','B','C','D'];
    q.options.forEach((opt, i) => {
      const div = document.createElement('div');
      div.className = 'option';
      div.innerHTML = `<span class="option-letter">${letters[i]}</span><span>${opt}</span>`;
      div.addEventListener('click', () => selectOption(i, div));
      optionsContainer.appendChild(div);
    });

    startTimer();
  }

  function selectOption(index, el){
    if(selectedOption !== null) return; // lock after first pick
    selectedOption = index;
    userAnswers[currentIndex] = index;

    document.querySelectorAll('.option').forEach((o, i) => {
      if(i === index) o.classList.add('selected');
    });
    nextBtn.disabled = false;
    stopTimer();
  }

  function startTimer(){
    stopTimer();
    timeLeft = 30;
    qTimer.textContent = `${timeLeft}s`;
    qTimer.classList.remove('warn');
    timerInterval = setInterval(() => {
      timeLeft--;
      qTimer.textContent = `${timeLeft}s`;
      if(timeLeft <= 10) qTimer.classList.add('warn');
      if(timeLeft <= 0){
        stopTimer();
        if(selectedOption === null){
          userAnswers[currentIndex] = -1; // no answer / timed out
        }
        nextBtn.disabled = false;
        nextBtn.click();
      }
    }, 1000);
  }
  function stopTimer(){
    if(timerInterval) clearInterval(timerInterval);
  }

  nextBtn.addEventListener('click', () => {
    stopTimer();
    if(currentIndex < questions.length - 1){
      currentIndex++;
      renderQuestion();
    }else{
      progressFill.style.width = '100%';
      showResults();
    }
  });

  quitBtn.addEventListener('click', () => {
    stopTimer();
    resetToSetup();
  });

  function showResults(){
    let correct = 0;
    reviewContainer.innerHTML = '';

    questions.forEach((q, i) => {
      const userAns = userAnswers[i];
      const isCorrect = userAns === q.correct_index;
      if(isCorrect) correct++;

      const letters = ['A','B','C','D'];
      const div = document.createElement('div');
      div.className = 'review-item';
      div.innerHTML = `
        <div class="review-q">${i+1}. ${q.question}</div>
        <div class="review-a ${isCorrect ? 'correct' : 'incorrect'}">
          ${isCorrect ? '✓' : '✗'} Your answer: ${userAns >= 0 ? letters[userAns] + '. ' + q.options[userAns] : '(no answer)'}
        </div>
        ${!isCorrect ? `<div class="review-a correct">✓ Correct: ${letters[q.correct_index]}. ${q.options[q.correct_index]}</div>` : ''}
        ${q.explanation ? `<div class="review-explain">${q.explanation}</div>` : ''}
      `;
      reviewContainer.appendChild(div);
    });

    scoreNum.textContent = `${correct}/${questions.length}`;
    showScreen(resultsScreen);
  }

  restartBtn.addEventListener('click', resetToSetup);

  function resetToSetup(){
    questions = [];
    currentIndex = 0;
    userAnswers = [];
    urlInput.value = '';
    clearError();
    showScreen(setupScreen);
  }
</script>

</body>
</html>
