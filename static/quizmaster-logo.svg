<svg width="640" height="360" viewBox="0 0 640 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">QuizMaster AI-Powered Logo</title>
  <desc id="desc">Purple geometric cube icon above the QuizMaster AI-powered wordmark.</desc>
